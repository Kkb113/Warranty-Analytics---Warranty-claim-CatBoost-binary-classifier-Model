[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warranty-analytics-model"
version = "0.1.0"
description = "Configuration-driven scaffolding for truck-warranty high-cost claim prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "packaging>=23,<26",
    "pydantic-settings>=2.0,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<5",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "python-docx>=1.1,<2",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0.12,<7",
]
database = [
    "pyodbc>=5.0,<6",
]
profiling = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
]
mart = [
    "pandas>=2.0,<3",
    "pyarrow>=14.0,<20",
]
modeling = [
    "catboost>=1.2.10,<2",
    "scikit-learn>=1.5,<2",
    "threadpoolctl>=3.5,<4",
]
optimization = [
    "optuna>=4,<5",
]

[project.scripts]
warranty-model = "warranty_analytics_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"warranty_analytics_model.database" = ["sql/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=warranty_analytics_model",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "database: optional live SQL Server checks; skipped unless explicitly enabled",
]

[tool.coverage.run]
branch = true
source = ["warranty_analytics_model"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
precision = 2
fail_under = 80

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["warranty_analytics_model"]
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["catboost", "catboost.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true
