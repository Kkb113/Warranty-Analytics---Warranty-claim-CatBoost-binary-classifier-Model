development_status:
  development_mode: synthetic_poc
  production_approved: false
  real_data_reapproval_required: true
  business_target_definition_confirmed: false
  generator_source_confirmed: false
  exact_submission_timestamp_available: false
policy_defaults:
  target: &target_defaults
    role: target
    availability_basis: stored_supervised_label
    as_of_rule: target_only
    leakage_risks: [target_leakage, synthetic_generator_leakage]
    synthetic_poc_allowed: false
    production_approved: false
    reason: Stored label is used only as the supervised target and never as an input.
    evidence_source: Phase 4 target and leakage contract
    notes: Do not derive or proxy this field from outcome cost.
    is_model_feature: false
    is_lineage: false
  control: &control_defaults
    role: identifier_or_control
    availability_basis: join_lineage_audit_only
    as_of_rule: not_applicable
    leakage_risks: [identifier_leakage]
    synthetic_poc_allowed: false
    production_approved: false
    reason: Retain only for joins, lineage, auditing, or future split control.
    evidence_source: Phase 4 identifier and lineage policy
    notes: Control metadata is never a learned feature.
    is_model_feature: false
    is_lineage: true
  baseline: &baseline_defaults
    role: claim_time_descriptive_feature
    availability_basis: available_at_initial_claim_submission_assumption
    as_of_rule: claim_submission_reference
    leakage_risks: [temporal_leakage_if_revised]
    synthetic_poc_allowed: true
    production_approved: false
    reason: Provisionally allowed for synthetic POC under the claim-time contract only.
    evidence_source: Phase 0 model contract and Phase 4 policy
    notes: Production use requires data-owner confirmation and real-data reapproval.
    is_model_feature: true
    is_lineage: false
  historical: &historical_defaults
    role: historical_claim_time_feature
    availability_basis: historical_source_record
    as_of_rule: strict_before_source_event_date
    leakage_risks: [temporal_leakage, same_day_leakage]
    synthetic_poc_allowed: true
    production_approved: false
    reason: Allowed only after the source-specific historical as-of rule is enforced.
    evidence_source: Phase 4 historical source policy
    notes: Phase 5 must preserve the source rule and same-day exclusion.
    is_model_feature: true
    is_lineage: false
  restricted: &restricted_defaults
    role: restricted_group_or_governance_feature
    availability_basis: requires_controlled_evaluation
    as_of_rule: controlled_evaluation_only
    leakage_risks: [group_leakage, identifier_leakage, governance_risk]
    synthetic_poc_allowed: false
    production_approved: false
    reason: Isolated from Tier A and eligible only for separately governed evaluation.
    evidence_source: Phase 3 synthetic audit and Phase 4 group policy
    notes: Preserve for later group-aware evaluation; do not add silently to the baseline.
    is_model_feature: false
    is_lineage: false
  confirmation: &confirmation_defaults
    role: unresolved_availability_or_governance
    availability_basis: timing_or_business_meaning_unconfirmed
    as_of_rule: unavailable_until_confirmed
    leakage_risks: [temporal_leakage, governance_risk]
    synthetic_poc_allowed: false
    production_approved: false
    reason: Excluded until claim-submission availability and business meaning are confirmed.
    evidence_source: Phase 0 open questions and Phase 4 policy
    notes: Do not guess; a policy revision with an explicit version increment is required.
    is_model_feature: false
    is_lineage: false
  prohibited: &prohibited_defaults
    role: outcome_or_leakage_field
    availability_basis: post_outcome_or_direct_leakage
    as_of_rule: never_allowed
    leakage_risks: [direct_leakage, temporal_leakage]
    synthetic_poc_allowed: false
    production_approved: false
    reason: Prohibited from the target feature set under the current contract.
    evidence_source: Phase 3 leakage audit and Phase 4 leakage policy
    notes: This prohibition applies to current-claim and derived uses.
    is_model_feature: false
    is_lineage: false
feature_policy_enum:
  - TARGET_ONLY
  - CONTROL_ONLY
  - ALLOW_BASELINE_POC
  - ALLOW_HISTORICAL_POC
  - RESTRICTED_EXPERIMENTAL
  - REQUIRES_CONFIRMATION
  - PROHIBITED
prediction_time_policy:
  reference_column: claim_date
  reference_precision: date_only
  reference_status: provisional_date_level_reference
  event_date_comparison: "<"
  event_rule: strict_before_date_policy
  same_day_default: exclude
  telemetry_completed_month_rule: end_of_month(month_start_date) < claim_date
same_day_policy:
  default: exclude
  rule: event_date must be strictly earlier than claim_date
  rationale: Date-only columns cannot prove same-day event ordering.
  future_revision_condition: Precise event and submission timestamps with an approved process rule.
historical_sources:
  telemetry:
    source_table: dbo.fact_telemetry_monthly
    event_date_column: month_start_date
    qualification_rule: end_of_month(month_start_date) < claim_date
    same_day_policy: exclude
    current_record_exclusion: The month containing claim_date is excluded.
    completion_gate: Monthly aggregate must represent a completed month.
    notes: month_start_date < claim_date alone is not sufficient.
  maintenance:
    source_table: dbo.fact_maintenance_event
    event_date_column: maintenance_date
    qualification_rule: maintenance_date < claim_date
    same_day_policy: exclude
    current_record_exclusion: Same-day maintenance is excluded.
    notes: Missing maintenance history does not make a claim ineligible.
  service:
    source_table: dbo.fact_service_event
    event_date_column: service_date
    qualification_rule: service_date < claim_date
    same_day_policy: exclude
    current_record_exclusion: service_event_key != current_claim.service_event_key
    notes: Current claim-linked service fields are not baseline-approved.
  repair:
    source_table: dbo.fact_repair_line
    event_date_column: null
    qualification_rule: repair_line.warranty_claim_key != current_claim.warranty_claim_key and prior_claim.repair_end_date < claim_date
    same_day_policy: exclude
    current_record_exclusion: Current-claim repair lines are prohibited.
    completion_gate: Prior repair completion must be proven; otherwise do not use the line.
    notes: This source has no independent repair-line date.
  prior_claim:
    source_table: dbo.fact_warranty_claim
    event_date_column: claim_date
    qualification_rule: prior_claim.claim_date < claim_date; outcome fields require prior_claim.repair_end_date < claim_date
    same_day_policy: exclude
    current_record_exclusion: prior_claim.warranty_claim_key != current_claim.warranty_claim_key
    completion_gate: Prior outcome fields require completion before the current claim date.
    notes: Prior submission fields and prior outcomes have different availability rules.
  component_installation:
    source_table: dbo.fact_component_installation
    event_date_column: installed_date
    qualification_rule: installed_date < claim_date
    same_day_policy: exclude
    current_record_exclusion: Do not require current claim causal_component_key.
    notes: Build truck-level history from pre-claim installations without current diagnosis.
feature_tiers:
  tier_a_safe_baseline:
    description: Only direct or historical fields with explicit claim-time availability and no unresolved or restricted status.
    included_policies: [ALLOW_BASELINE_POC, ALLOW_HISTORICAL_POC]
    requires_as_of_enforcement: true
    restricted_evaluation_only: false
  tier_b_restricted_experimental:
    description: High-cardinality, mutable, synthetic-risk, or governance-sensitive fields for isolated evaluation only.
    included_policies: [RESTRICTED_EXPERIMENTAL]
    requires_as_of_enforcement: true
    restricted_evaluation_only: true
