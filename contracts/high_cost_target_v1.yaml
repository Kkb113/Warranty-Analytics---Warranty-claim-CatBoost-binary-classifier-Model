known_limitations:
  - claim_date is a date-level proxy and is not a precise submission timestamp
  - the business definition of high cost is not confirmed by a data owner
  - the synthetic generator source was not found or approved
  - the current source population is synthetic and requires real-data reapproval
  - target-generation evidence must not be converted into a production threshold
