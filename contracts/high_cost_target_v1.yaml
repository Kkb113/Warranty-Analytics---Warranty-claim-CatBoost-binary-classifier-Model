  maximum_negative_total_claim_cost: 9998.14
  minimum_positive_total_claim_cost: 10000.91
  business_rule_approved: false
  generator_source_confirmed: false
  interpretation: Empirical synthetic target-generation evidence only; never recreate the target from cost.
eligibility_policy:
  row_grain: one warranty claim row
  required_conditions:
    - warranty_claim_key is non-null
    - warranty_claim_key is unique
    - claim_date is non-null
    - high_cost_claim_flag is in {0, 1}
    - truck_key resolves to dbo.dim_truck.truck_key
    - one row represents one warranty claim
  excluded_conditions:
    - complete telemetry history is not required
    - complete maintenance history is not required
    - repair information is not required
    - part number is not required
    - repair completion is not required
    - post-outcome cost fields are not required
  categories:
    - code: ELIGIBLE
      description: All minimum claim identity, date, target, truck-link, and grain rules pass.
      priority: 5
    - code: INELIGIBLE_INVALID_CLAIM_KEY
      description: Claim key is null or duplicated.
      priority: 1
    - code: INELIGIBLE_NULL_TARGET
      description: Stored target is null.
      priority: 2
    - code: INELIGIBLE_INVALID_TARGET
      description: Stored target is not 0 or 1.
      priority: 3
    - code: INELIGIBLE_MISSING_CLAIM_DATE
      description: Provisional claim reference date is null or invalid.
      priority: 4
    - code: INELIGIBLE_MISSING_TRUCK_LINK
      description: Claim truck_key does not resolve to dim_truck.
      priority: 6
  no_silent_drop: true
prohibited_derivation_fields:
  - dbo.fact_warranty_claim.total_claim_cost
  - total_claim_cost
  - dbo.fact_warranty_claim.labor_cost
  - dbo.fact_warranty_claim.parts_cost
  - dbo.fact_warranty_claim.approved_amount
