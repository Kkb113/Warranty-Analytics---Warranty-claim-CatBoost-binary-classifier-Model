    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.labor_cost
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim outcome cost.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.parts_cost
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim outcome cost.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.diagnostic_cost
