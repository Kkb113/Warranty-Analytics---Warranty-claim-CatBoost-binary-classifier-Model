    reason: Current-claim outcome cost.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.towing_cost
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim outcome cost.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.other_cost
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim outcome cost.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.approved_amount
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim adjudication outcome.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.rejected_amount
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim adjudication outcome.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.customer_paid_amount
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim financial outcome.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.repair_end_date
    leakage_types: [temporal_leakage, direct_leakage]
    reason: Repair completion occurs after initial claim submission.
    applies_to: current_claim
  - field: dbo.fact_warranty_claim.days_to_repair
    leakage_types: [temporal_leakage, direct_leakage]
    reason: Duration requires the post-submission repair outcome.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.claim_status
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Status may encode adjudication or repair outcome.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.root_cause_category
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Root cause is diagnostic/post-outcome information under the current evidence.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.repeat_claim_flag
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Current-claim repeat indicator is not approved at submission.
    applies_to: all_feature_tiers
  - field: dbo.fact_warranty_claim.potential_recall_flag
    leakage_types: [direct_leakage, temporal_leakage]
    reason: Recall status is mutable outcome/governance information.
    applies_to: all_feature_tiers
  - field: dbo.fact_repair_line.*
    leakage_types: [temporal_leakage, direct_leakage, synthetic-generator-leakage]
    reason: Current-claim repair lines, labor, parts, actions, and notes are prohibited.
    applies_to: current_claim
  - field: dbo.fact_service_event.diagnostic_summary
    leakage_types: [temporal_leakage, direct_leakage]
    reason: Final diagnostic information may be written after inspection.
    applies_to: current_claim
  - field: dbo.fact_service_event.service_status
    leakage_types: [temporal_leakage, direct_leakage]
    reason: Any repair status is post-submission outcome information.
    applies_to: current_claim
