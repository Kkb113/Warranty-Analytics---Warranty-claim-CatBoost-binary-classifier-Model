excluded_tables:
  - dbo.ml_region_terrain_warranty_risk_dataset
  - dbo.ml_truck_failure_risk_dataset
  - dbo.ml_truck_region_terrain_failure_risk_dataset
current_claim_exclusions:
  - dbo.fact_repair_line.* is prohibited for current-claim use
  - current-claim labor hours, parts, repair notes, and repair actions are prohibited
  - dbo.fact_service_event.diagnostic_summary is not baseline-approved
  - current causal_component_key and failure_code_key require confirmation
  - root_cause_category is prohibited/post-outcome
historical_rules:
  telemetry: end_of_month(month_start_date) < claim_date
  maintenance: maintenance_date < claim_date
  service: service_date < claim_date and service_event_key != current_claim.service_event_key
  repair: repair_line.warranty_claim_key != current_claim.warranty_claim_key and prior_claim.repair_end_date < claim_date
  prior_claim: prior_claim.claim_date < claim_date; prior outcomes require completion before claim_date
  component_installation: installed_date < claim_date and current claim causal_component_key is not required
