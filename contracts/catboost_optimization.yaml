  search:
    sampler: TPESampler
    n_startup_trials: 10
    parallel_jobs: 1
    pruning: false
    objective_metric: mean_average_precision
    search_space:
      iterations: {type: categorical, values: [300, 500, 700, 1000, 1400]}
      learning_rate: {type: float, low: 0.015, high: 0.15, log: true}
      depth: {type: int, low: 4, high: 9}
