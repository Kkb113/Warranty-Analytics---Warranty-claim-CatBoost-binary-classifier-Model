      border_count: {type: categorical, values: [64, 128, 254]}
      rsm: {type: float, low: 0.70, high: 1.00}
  fixed_catboost_policy:
    loss_function: Logloss
    bootstrap_type: Bayesian
    random_seed: 20260810
    task_type: CPU
    thread_count: 10
    allow_writing_files: false
    verbose: false
    use_best_model: false
  class_imbalance_policy:
    class_weights: none
    auto_class_weights: none
    scale_pos_weight: none
    resampling: prohibited
  early_stopping_policy: prohibited
  threshold_policy:
    value: 0.5
    tuning: prohibited
  calibration_policy: prohibited
  feature_selection_policy:
    phase10: prohibited
    owner: phase11
  objective_policy:
    primary_metric: mean_average_precision
    direction: maximize
    tie_breakers:
      - min_average_precision
      - mean_roc_auc
      - std_average_precision
      - mean_log_loss
  outer_validation:
    loaded_after_study_freeze_only: true
    finalist_count: 2
    finalist_models_only: true
  dependency_policy:
    optimization_extra: optimization
    requirements:
      python: ">=3.11"
      optuna: ">=4,<5"
      catboost: ">=1.2.10,<2"
      pandas: ">=2.0,<3"
      numpy: ">=1.24,<3"
      pyarrow: ">=14.0,<20"
      scikit-learn: ">=1.5,<2"
  test_target_access:
    policy: FORBIDDEN_UNTIL_PHASE_15
    first_allowed_phase: 15
  provenance:
    manifest_contract_checksum_field: contract_checksum
    manifest_contract_snapshot_field: contract_policy_snapshot
  feature_selection_owner: phase11
