historical_bridge_definitions:
  - name: telemetry
    artifact: telemetry_history
    source_table: dbo.fact_telemetry_monthly
    grain: one current claim to zero or many completed telemetry months
    pair_key: [current_warranty_claim_key, telemetry_month_key]
    as_of_rule: end_of_month(month_start_date) < claim_date
    same_day_policy: exclude
    current_record_exclusion: the month containing claim_date is excluded
    field_mappings:
