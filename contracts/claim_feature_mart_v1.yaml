      - {artifact: prior_claim_history, output_column: prior_failure__failure_code, source_table: dbo.dim_failure_code, source_column: failure_code, policy: ALLOW_HISTORICAL_POC, is_model_feature: true, transform_type: dimension_join, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: prior_claim.claim_date < claim_date}
      - {artifact: prior_claim_history, output_column: prior_failure__failure_description, source_table: dbo.dim_failure_code, source_column: failure_description, policy: ALLOW_HISTORICAL_POC, is_model_feature: true, transform_type: dimension_join, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: prior_claim.claim_date < claim_date}
      - {artifact: prior_claim_history, output_column: prior_failure__failure_system, source_table: dbo.dim_failure_code, source_column: failure_system, policy: ALLOW_HISTORICAL_POC, is_model_feature: true, transform_type: dimension_join, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: prior_claim.claim_date < claim_date}
      - {artifact: prior_claim_history, output_column: prior_failure__failure_category, source_table: dbo.dim_failure_code, source_column: failure_category, policy: ALLOW_HISTORICAL_POC, is_model_feature: true, transform_type: dimension_join, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: prior_claim.claim_date < claim_date}
      - {artifact: prior_claim_history, output_column: prior_failure__severity_level, source_table: dbo.dim_failure_code, source_column: severity_level, policy: ALLOW_HISTORICAL_POC, is_model_feature: true, transform_type: dimension_join, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: prior_claim.claim_date < claim_date}
      - {artifact: prior_claim_history, output_column: prior_failure__safety_related_flag, source_table: dbo.dim_failure_code, source_column: safety_related_flag, policy: ALLOW_HISTORICAL_POC, is_model_feature: true, transform_type: dimension_join, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: prior_claim.claim_date < claim_date}
      - {artifact: prior_claim_history, output_column: prior_failure__recall_related_flag, source_table: dbo.dim_failure_code, source_column: recall_related_flag, policy: ALLOW_HISTORICAL_POC, is_model_feature: true, transform_type: dimension_join, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: prior_claim.claim_date < claim_date}
    control_mappings:
      - {artifact: prior_claim_history, output_column: current_warranty_claim_key, source_table: dbo.fact_warranty_claim, source_column: warranty_claim_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_warranty_claim.warranty_claim_key], as_of_rule: eligible claim identity}
      - {artifact: prior_claim_history, output_column: prior_warranty_claim_key, source_table: dbo.fact_warranty_claim, source_column: warranty_claim_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_warranty_claim.warranty_claim_key], as_of_rule: prior claim identity}
      - {artifact: prior_claim_history, output_column: lineage__truck_key, source_table: dbo.fact_warranty_claim, source_column: truck_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_warranty_claim.truck_key], as_of_rule: truck match control}
      - {artifact: prior_claim_history, output_column: prior_claim__claim_date, source_table: dbo.fact_warranty_claim, source_column: claim_date, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: temporal_filter, join_path: [dbo.fact_warranty_claim.claim_date], as_of_rule: prior_claim.claim_date < claim_date}
      - {artifact: prior_claim_history, output_column: prior_failure_code_key, source_table: dbo.fact_warranty_claim, source_column: failure_code_key, policy: REQUIRES_CONFIRMATION, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key], as_of_rule: internal historical join key only}

  - name: repair
    artifact: repair_history_index
    source_table: dbo.fact_repair_line
    grain: one current claim to zero or many eligible prior repair lines
    pair_key: [current_warranty_claim_key, repair_line_key]
    as_of_rule: prior_claim.repair_end_date < claim_date and repair_line.warranty_claim_key != current_warranty_claim_key
    same_day_policy: exclude
    current_record_exclusion: current-claim repair lines are prohibited
    field_mappings: []
    control_mappings:
      - {artifact: repair_history_index, output_column: current_warranty_claim_key, source_table: dbo.fact_warranty_claim, source_column: warranty_claim_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_warranty_claim.warranty_claim_key], as_of_rule: eligible claim identity}
      - {artifact: repair_history_index, output_column: prior_warranty_claim_key, source_table: dbo.fact_warranty_claim, source_column: warranty_claim_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_repair_line.warranty_claim_key, dbo.fact_warranty_claim.warranty_claim_key], as_of_rule: prior claim repair completion gate}
      - {artifact: repair_history_index, output_column: repair_line_key, source_table: dbo.fact_repair_line, source_column: repair_line_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_repair_line.repair_line_key], as_of_rule: bridge pair key}
      - {artifact: repair_history_index, output_column: prior_repair_end_date, source_table: dbo.fact_warranty_claim, source_column: repair_end_date, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: temporal_filter, join_path: [dbo.fact_warranty_claim.repair_end_date], as_of_rule: prior_claim.repair_end_date < claim_date}
      - {artifact: repair_history_index, output_column: component_key, source_table: dbo.fact_repair_line, source_column: component_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_repair_line.component_key], as_of_rule: restricted control index only}
      - {artifact: repair_history_index, output_column: service_event_key, source_table: dbo.fact_repair_line, source_column: service_event_key, policy: CONTROL_ONLY, is_lineage: true, is_control: true, transform_type: history_bridge, join_path: [dbo.fact_repair_line.service_event_key], as_of_rule: restricted control index only}

restricted_artifact_definitions:
  - artifact: repair_history_index
    status: CONTROL_ONLY
    description: Only prior-repair eligibility keys are preserved; repair values remain deferred.
    excluded_fields: [dbo.fact_repair_line.*]
  - artifact: claim_group_membership
    status: NON_MODEL_METADATA
    description: Group and duplicate-control relationships for future split design.

artifact_column_mappings:
  - {artifact: claim_group_membership, output_column: warranty_claim_key, source_table: derived, source_column: warranty_claim_key, policy: CONTROL_ONLY, is_model_feature: false, is_target: false, is_lineage: true, is_control: true, transform_type: hash_lineage, join_path: [], as_of_rule: group metadata only}
  - {artifact: claim_group_membership, output_column: group_type, source_table: derived, source_column: group_type, policy: CONTROL_ONLY, is_model_feature: false, is_target: false, is_lineage: true, is_control: true, transform_type: hash_lineage, join_path: [], as_of_rule: group metadata only}
  - {artifact: claim_group_membership, output_column: group_value, source_table: derived, source_column: group_value, policy: CONTROL_ONLY, is_model_feature: false, is_target: false, is_lineage: true, is_control: true, transform_type: hash_lineage, join_path: [], as_of_rule: group metadata only}
  - {artifact: claim_group_membership, output_column: group_value_hash, source_table: derived, source_column: group_value_hash, policy: CONTROL_ONLY, is_model_feature: false, is_target: false, is_lineage: true, is_control: true, transform_type: hash_lineage, join_path: [], as_of_rule: group metadata only}
  - {artifact: claim_group_membership, output_column: source, source_table: derived, source_column: source, policy: CONTROL_ONLY, is_model_feature: false, is_target: false, is_lineage: true, is_control: true, transform_type: hash_lineage, join_path: [], as_of_rule: group metadata only}
  - {artifact: claim_group_membership, output_column: is_model_feature, source_table: derived, source_column: is_model_feature, policy: CONTROL_ONLY, is_model_feature: false, is_target: false, is_lineage: true, is_control: true, transform_type: hash_lineage, join_path: [], as_of_rule: group metadata only}

artifact_layout:
  root: artifacts/feature_mart/<run_id>
  snapshot: claim_snapshot.parquet
  histories:
    telemetry: history/telemetry_history.parquet
    maintenance: history/maintenance_history.parquet
    service: history/service_history.parquet
    component_installation: history/component_installation_history.parquet
    prior_claim: history/prior_claim_history.parquet
    repair: history/repair_history_index.parquet
  lineage: lineage/claim_group_membership.parquet
  manifest: manifest.json
  column_manifest: column_manifest.json
  field_lineage: field_lineage.json
  validation: validation.json

column_naming_policy:
  direct_prefixes: [claim__, truck__, truck_model__, warranty_policy__, claim_calendar__, service_location__]
  historical_prefixes: [telemetry__, maintenance__, service__, component_installation__, component__, prior_claim__, prior_failure__]
  target_prefix: target__
  control_prefixes: [lineage__, current_, prior_, repair_, component_lot_no, production_batch_id, supplier_key, component_key, service_event_key, telemetry_month_key, maintenance_event_key, installation_key]
  raw_surrogate_keys_are_model_features: false

serialization_policy:
  format: parquet
  compression: snappy
  preserve_dates: true
  preserve_nullable_numeric_values: true
  preserve_booleans: true
  preserve_strings: true
  deterministic_column_order: true
  deterministic_row_order: true
  persist_index: false
  null_semantics: preserve_sql_null

deferred_fields:
  - {tier: restricted, field: dbo.fact_repair_line.*, mapping_status: DEFERRED_WITH_REASON, reason: repair detail values require a separately reviewed historical availability policy}
  - {tier: confirmation, field: dbo.fact_warranty_claim.failure_code_key, mapping_status: DEFERRED_WITH_REASON, reason: current-claim diagnostic field remains unapproved; only prior-claim internal joining is permitted}
  - {tier: confirmation, field: dbo.fact_warranty_claim.causal_component_key, mapping_status: DEFERRED_WITH_REASON, reason: component history is truck-level and never selected by current diagnosis}

source_join_paths:
  claim_to_truck: [dbo.fact_warranty_claim.truck_key, dbo.dim_truck.truck_key]
  truck_to_model: [dbo.dim_truck.truck_model_key, dbo.dim_truck_model.truck_model_key]
  truck_to_policy: [dbo.dim_truck.warranty_policy_key, dbo.dim_warranty_policy.warranty_policy_key, dbo.dim_warranty_policy.effective_start_date, dbo.dim_warranty_policy.effective_end_date]
  claim_to_calendar: [dbo.fact_warranty_claim.claim_date, dbo.dim_date.full_date]
  service_location: [dbo.fact_warranty_claim.service_center_key, dbo.dim_service_center.service_center_key, dbo.dim_service_center.location_key, dbo.dim_location.location_key]
  component_to_dimension: [dbo.fact_component_installation.component_key, dbo.dim_component.component_key]
  prior_claim_to_failure: [dbo.fact_warranty_claim.failure_code_key, dbo.dim_failure_code.failure_code_key]

safety_rules:
  no_select_star: true
  no_sql_writes: true
  no_excluded_ml_tables: true
  no_target_derived_features: true
  no_historical_aggregations: true
  no_imputation: true
  no_categorical_encoding: true
  no_scaling: true
  no_text_features: true
  no_split_assignments: true
  no_model_training: true
  component_history_does_not_use_current_causal_component_key: true
  safe_scenario_fingerprint_input_columns:
    - claim__claim_date
    - claim__odometer_miles_at_failure
    - claim__engine_hours_at_failure
    - claim__months_in_service
    - claim__warranty_coverage_status
    - claim__claim_type
    - truck__manufacturing_plant
    - truck__assembly_line
    - truck__build_date
    - truck__delivery_date
    - truck__in_service_date
    - truck__axle_configuration
    - truck__fuel_type
    - truck__emission_standard
    - truck_model__brand
    - truck_model__model_name
    - truck_model__model_year
    - truck_model__segment
    - truck_model__application_type
    - truck_model__cab_type
    - truck_model__engine_platform
    - truck_model__gvwr_class
    - warranty_policy__coverage_months
    - warranty_policy__coverage_miles
    - warranty_policy__coverage_engine_hours
    - warranty_policy__deductible_amount
    - warranty_policy__coverage_type
    - claim_calendar__day_number
    - claim_calendar__day_name
    - claim_calendar__week_number
    - claim_calendar__month_number
    - claim_calendar__month_name
    - claim_calendar__quarter_number
    - claim_calendar__year_number
    - claim_calendar__fiscal_month
    - claim_calendar__fiscal_quarter
    - claim_calendar__fiscal_year
    - service_location__country
    - service_location__region
    - service_location__climate_zone
    - service_location__terrain_type
    - lineage__truck_model_key
    - lineage__production_batch_id
    - lineage__service_center_key
