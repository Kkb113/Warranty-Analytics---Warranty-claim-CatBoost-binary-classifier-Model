catboost_optimization:
  tracks:
    - T1
    - T3
  trials_per_track: 50
  parallel_jobs: 1
  pruning: false
  threshold: 0.5
  random_seed: 20260810
  sampler: TPESampler
  n_startup_trials: 10
  fixed_parameters:
    loss_function: Logloss
    bootstrap_type: Bayesian
    random_seed: 20260810
    task_type: CPU
    # Use most physical cores for each fit while leaving headroom for Windows
    # and data preparation. Optuna trials remain sequential to avoid memory
    # multiplication and preserve deterministic TPE ordering.
    thread_count: 10
    allow_writing_files: false
    verbose: false
    use_best_model: false
  search_space:
    iterations:
      type: categorical
      values: [300, 500, 700, 1000, 1400]
    learning_rate:
      type: float
      low: 0.015
      high: 0.15
      log: true
    depth:
      type: int
      low: 4
      high: 9
    l2_leaf_reg:
      type: float
      low: 1.0
      high: 30.0
      log: true
    random_strength:
      type: float
      low: 0.0
      high: 3.0
    bagging_temperature:
      type: float
      low: 0.0
      high: 5.0
    border_count:
      type: categorical
      values: [64, 128, 254]
    rsm:
      type: float
      low: 0.70
      high: 1.00
  inner_fold_fractions: [0.55, 0.70, 0.85, 1.00]
  minimum_train_positive: 40
  minimum_validation_positive: 10
  instability_std_ap_warning: 0.04
  failure_warning_fraction: 0.10
  minimum_completed_fraction: 0.80
  output_directory: artifacts/catboost_optimization
  report_directory: reports/phase10_catboost_optimization
  compression: snappy
