baseline_model:
  model_family: catboost
  random_seed: 20260810
  catboost:
    loss_function: Logloss
    iterations: 500
    learning_rate: 0.05
    depth: 6
    l2_leaf_reg: 3.0
    random_strength: 1.0
    bootstrap_type: Bayesian
    bagging_temperature: 1.0
    task_type: CPU
    thread_count: 1
    allow_writing_files: false
    verbose: false
    use_best_model: false
  text_processing:
    tokenizers:
      - tokenizer_id: Space
        separator_type: ByDelimiter
        delimiter: " "
    dictionaries:
      - dictionary_id: Word
        token_level_type: Word
        occurrence_lower_bound: "1"
    feature_processing:
      default:
        - tokenizers_names: [Space]
          dictionaries_names: [Word]
          feature_calcers: [BoW]
  categorical_missing_value: __MISSING__
  text_missing_value: __NO_HISTORY__
  fixed_threshold: 0.5
  primary_metric: average_precision
  output_directory: artifacts/baseline_models
  report_directory: reports/phase9_baseline_models
  compression: snappy
