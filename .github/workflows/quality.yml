name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database,profiling,mart,modeling,optimization]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Pytest with coverage
        run: python -m pytest

      - name: Validate schema contract offline
        run: warranty-model schema-contract-check

      - name: Validate Phase 4 policy contracts offline
        run: warranty-model phase4-contract-check

      - name: Validate Phase 5 mart plan offline
        run: warranty-model phase5-plan-check

      - name: Validate Phase 6 split contract offline
        run: warranty-model phase6-contract-check

      - name: Validate Phase 7 structured feature contract offline
        run: warranty-model phase7-contract-check

      - name: Validate Phase 8 text feature contract offline
        run: warranty-model phase8-contract-check

      - name: Validate Phase 9 baseline model contract offline
        run: warranty-model phase9-contract-check

      - name: Validate Phase 10 CatBoost optimization contract offline
        run: warranty-model phase10-contract-check

